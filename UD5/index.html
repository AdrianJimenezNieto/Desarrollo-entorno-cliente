<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción a Cursos Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>Registro de Estudiante</h2>
        <form id="registrationForm" novalidate>
            <div class="form-group">
                <label for="name">Nombre completo</label>
                <input type="text" id="name" name="name" required>
                <span class="error-message">El nombre debe tener más de 2 caracteres.</span>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required>
                <span class="error-message">Por favor, introduce un correo válido.</span>
            </div>

            <div class="form-group">
                <label for="phone">Teléfono (ej. +34 600-123-456)</label>
                <input type="tel" id="phone" name="phone" required>
                <span class="error-message">Formato requerido: +34 XXX-XXX-XXX.</span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" minlength="8" required>
                <span class="error-message">Mínimo 8 caracteres: 1 mayúscula, 1 minúscula, 1 número y 1 carácter especial (@$!%*?&).</span>
            </div>

            <button type="submit" id="submitBtn" disabled>
                <span class="btn-text">Completar Inscripción</span>
                <div class="loader" id="loader"></div>
            </button>
        </form>

        <div id="successMessage" class="success-message">
            ¡Registro completado con éxito! Recibirás un correo pronto.
        </div>
    </div>

    <script src="validator.js"></script>
    <script src="app.js"></script>
</body>
</html>
